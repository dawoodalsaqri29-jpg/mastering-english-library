<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(fraunces-latin.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Inter;src:url(inter-latin.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Cairo;src:url(cairo-700.woff2) format("woff2");font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#0b1a1f center/cover no-repeat;color:#f3ecd8;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center}
.v{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(5,15,18,.25) 0%,rgba(5,15,18,.8) 75%)}
.c{position:relative;text-align:center;max-width:1500px}
.k{font-size:30px;letter-spacing:.32em;text-transform:uppercase;color:#d9b45a;font-weight:600}
h1{font-family:Fraunces,serif;font-weight:700;font-size:120px;line-height:1.05;margin:26px 0 22px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.ar{font-family:Cairo,sans-serif;font-weight:700;font-size:54px;color:#e8dcc0;direction:rtl}
.line{width:220px;height:2px;background:linear-gradient(90deg,transparent,#d9b45a,transparent);margin:30px auto}
.s{font-size:30px;color:#cfd9d6;letter-spacing:.06em}
</style></head><body><div class="v"></div><div class="c" id="c"></div>
<script>
const p=new URLSearchParams(location.search);document.body.style.backgroundImage=`url(${p.get('bg')})`;
document.getElementById('c').innerHTML=`<div class="k">${p.get('k')}</div><h1>${p.get('t')}</h1><div class="line"></div><div class="ar">${p.get('ar')}</div>${p.get('s')?`<p class="s" style="margin-top:28px">${p.get('s')}</p>`:''}`;
</script></body></html>
