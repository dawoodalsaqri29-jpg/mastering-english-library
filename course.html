<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course player | Mastering English Library</title>
<meta name="description" content="Step-by-step English course modules with slides, knowledge checks and a graded challenge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/course.css">
<link rel="stylesheet" href="assets/player.css">
</head>
<body class="player" data-player>
<header class="pl-top">
  <a class="pl-back" href="courses.html" aria-label="Back to my courses">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="mark">ME</span>
  </a>
  <div class="pl-title"><span class="pl-course" id="plCourse">Loading…</span><span class="pl-module" id="plModule"></span></div>
  <div class="pl-progress" title="Course progress">
    <div class="ring sm" id="plRing" style="--p:0"><span id="plPct">0%</span></div>
    <span class="pl-progress-txt">Your progress</span>
  </div>
  <button class="pl-icon" id="plMenu" type="button" aria-label="Show course content" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
</header>

<div class="pl-body">
  <aside class="pl-side" id="plSide" aria-label="Course content">
    <div class="pl-side-head"><h2>Course content</h2><button class="pl-icon pl-close" id="plClose" type="button" aria-label="Close">×</button></div>
    <div id="plOutline"></div>
  </aside>

  <main class="pl-main" id="plMain">
    <div class="stage-wrap">
      <div class="stage" id="stage" tabindex="-1" aria-live="polite"></div>
    </div>
    <div class="pl-controls">
      <button class="pl-nav" id="prevBtn" type="button" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="pl-dots" id="dots" role="tablist" aria-label="Slides"></div>
      <span class="pl-count" id="count"></span>
      <button class="pl-tool" id="listenBtn" type="button" aria-pressed="false" title="Listen to this slide (L)">🔊 <span>Listen</span></button>
      <button class="pl-tool" id="fsBtn" type="button" title="Full screen (F)">⛶ <span>Full screen</span></button>
      <button class="pl-nav next" id="nextBtn" type="button" aria-label="Next slide">
        <span>Next</span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="pl-tabs">
      <div role="tablist" class="tab-row">
        <button role="tab" type="button" aria-selected="true" data-tab="overview">Overview</button>
        <button role="tab" type="button" aria-selected="false" data-tab="notes">My notes</button>
        <button role="tab" type="button" aria-selected="false" data-tab="resources">Resources</button>
        <button role="tab" type="button" aria-selected="false" data-tab="keys">Shortcuts</button>
      </div>
      <div class="tab-panel" id="tabPanel"></div>
    </div>
  </main>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="assets/course.js"></script>
<script src="assets/player.js"></script>
</body>
</html>
