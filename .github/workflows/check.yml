# Runs scripts/check-site.js on every pull request and every push to main,
# so a broken link or script shows a red cross before it reaches the live site.
# Read-only, free on a public repo. Actions are pinned to commit SHAs.
name: site check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to a release whose apt mirrors failed (2026-11-11)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-save --no-package-lock playwright@1.63.0
      - run: npx --no playwright install --with-deps chromium
      # The safety rules as they are on main, run on this PR's files: a PR that loosens scripts/site-safety.js and adds
      # bad content in the same change fails. A rule change goes in its own PR first, with no content change.
      - name: Safety rules as they are on main
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git show "$BASE_SHA:scripts/site-safety.js" > "$RUNNER_TEMP/site-safety-main.js" 2>/dev/null; then
            node "$RUNNER_TEMP/site-safety-main.js" "$GITHUB_WORKSPACE"
          else
            echo "main has no scripts/site-safety.js yet"
          fi
      - run: node scripts/check-site.js
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # A lesson PDF may only change in the same PR as its lesson, or when the PDF build itself changes.
      - name: PDFs change only with their lesson or the PDF build
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$changed" | grep -qE '^(scripts/build-pdfs\.js|assets/style\.css|assets/fonts/)'; then
            echo "PDF build inputs changed: a full rebuild is allowed"; exit 0
          fi
          bad=0
          for p in $(echo "$changed" | grep -E '^pdfs/.+\.pdf$'); do
            l="lessons/$(basename "$p" .pdf).html"
            echo "$changed" | grep -qx "$l" || { echo "PDF CHANGED WITHOUT ITS LESSON: $p (run node scripts/build-pdfs.js $l)"; bad=1; }
          done
          exit $bad
