# Runs scripts/check-site.js on every pull request and every push to main,
# so a broken link or script shows a red cross before it reaches the live site.
# Read-only, free on a public repo. Actions are pinned to commit SHAs.
name: site check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-save --no-package-lock playwright@1.63.0
      - run: npx --no playwright install --with-deps chromium
      - run: node scripts/check-site.js
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
